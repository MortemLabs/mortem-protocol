[package]
name = "mortem"
version = "0.1.0"
description = "Mortem on-chain registry and Merkle batch commitment program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mortem"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
