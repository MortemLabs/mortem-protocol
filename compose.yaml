name: mortem

services:
  dashboard:
    build:
      context: .
      target: dashboard
      args:
        NEXT_PUBLIC_PRIVY_APP_ID: ${NEXT_PUBLIC_PRIVY_APP_ID}
        NEXT_PUBLIC_MORTEM_SERVER_URL: ${NEXT_PUBLIC_MORTEM_SERVER_URL:-http://localhost:3001/api/trpc}
        NEXT_PUBLIC_MORTEM_INGEST_URL: ${NEXT_PUBLIC_MORTEM_INGEST_URL:-http://localhost:4001}
        NEXT_PUBLIC_MORTEM_SITE_URL: ${NEXT_PUBLIC_MORTEM_SITE_URL:-https://mortem.dev}
    env_file:
      - ./apps/dashboard/.env.local
    ports:
      - "3000:3000"

  server:
    build:
      context: .
      target: server
    env_file:
      - ./apps/server/.env.local
    ports:
      - "3001:3001"

  ingest:
    build:
      context: .
      target: ingest
    env_file:
      - ./apps/ingest/.env.local
    ports:
      - "4001:4001"

  enrichment-worker:
    build:
      context: .
      target: enrichment-worker
    env_file:
      - ./apps/enrichment-worker/.env.local
    ports:
      - "4002:4002"
    profiles: ["workers"]
